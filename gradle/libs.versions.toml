[versions]
agpVersion = '9.4.1'
coreVersion = '1.19.0'
appCompatVersion = '1.8.0'
materialVersion = '1.14.0'
constraintLayoutVersion = '2.2.2'
# recyclerviewVersion = '1.3.2'
preferenceVersion = '1.2.1'

[libraries]
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appCompatVersion" }
core = { group = "androidx.core", name = "core", version.ref = "coreVersion" }
material = { group = "com.google.android.material", name = "material", version.ref = "materialVersion" }
constraintLayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintLayoutVersion" }
# recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "recyclerviewVersion" }
preference = { group = "androidx.preference", name = "preference", version.ref = "preferenceVersion" }

[plugins]
android-application = { id = 'com.android.application', version.ref = 'agpVersion' }
